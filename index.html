<style>
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#18264A; --soft:#5A6585; --line:#DCE1EE; --grid:#E7EBF4;
  --blue:#2B50C8; --blue-bg:#E6ECFD; --red:#CF2338; --red-bg:#FCE7EA; --green:#13805A; --green-bg:#E0F3EA;
  --amber:#A86A0A; --amber-bg:#FBF0DA; --margin:#F2A2AC;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141E; --card:#181E2C; --ink:#E5E9F4; --soft:#9AA4BF; --line:#2B3349; --grid:#1B2232;
    --blue:#89A4FF; --blue-bg:#1F2A4A; --red:#FF7A88; --red-bg:#3A1C24; --green:#5ACB98; --green-bg:#173327;
    --amber:#E7B25A; --amber-bg:#3A2D14; --margin:#6B2F39; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141E; --card:#181E2C; --ink:#E5E9F4; --soft:#9AA4BF; --line:#2B3349; --grid:#1B2232;
  --blue:#89A4FF; --blue-bg:#1F2A4A; --red:#FF7A88; --red-bg:#3A1C24; --green:#5ACB98; --green-bg:#173327;
  --amber:#E7B25A; --amber-bg:#3A2D14; --margin:#6B2F39; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px}
h1{font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;letter-spacing:-.02em}
.sub{color:var(--soft);margin:6px 0 0;font-size:15px}
.total{font-size:14px;color:var(--soft);text-align:right}
.total b{display:block;font-size:24px;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.groups{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.gbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;white-space:nowrap;font-weight:600;font-size:15px}
.gbtn .n{color:var(--soft);font-weight:400;margin-right:6px}
.gbtn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.gbtn[aria-pressed="true"] .n{color:inherit;opacity:.7}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}
.sbtn small{color:var(--soft);margin-left:4px}
.sbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.sbtn[aria-pressed="true"] small{color:var(--blue)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px}
.tbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.stats{display:flex;gap:12px;font-size:13px;color:var(--soft)}
.stats span b{font-size:15px;margin-right:3px}
.s-ok b{color:var(--green)} .s-acc b{color:var(--amber)} .s-ko b{color:var(--red)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
/* notebook card */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 22px 46px;min-height:260px;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--grid) 31px 32px);background-position:0 14px}
.card::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--margin)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-bottom:10px}
.instr{font-size:14px;color:var(--soft);margin:0 0 12px}
.q{font-family:Literata,Georgia,serif;font-size:clamp(18px,2.6vw,21px);line-height:1.6;margin:0 0 18px}
.q mark{background:var(--amber-bg);color:inherit;padding:0 3px;border-bottom:2px solid var(--amber);border-radius:2px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-family:Literata,Georgia,serif;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .key{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;color:var(--soft);min-width:14px}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default}
.tf{display:flex;gap:10px}
.tf .opt{flex:1;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:600}
input.blank{font-family:Literata,Georgia,serif;font-size:inherit;border:none;border-bottom:2px solid var(--blue);background:var(--blue-bg);color:var(--ink);padding:0 6px;width:9.5em;max-width:60vw;border-radius:3px 3px 0 0}
input.blank.ok{border-color:var(--green);background:var(--green-bg)}
input.blank.acc{border-color:var(--amber);background:var(--amber-bg)}
input.blank.ko{border-color:var(--red);background:var(--red-bg)}
textarea{width:100%;min-height:96px;font-family:Literata,Georgia,serif;font-size:17px;line-height:1.5;border:1.5px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink);resize:vertical}
.wrongsent{font-family:Literata,Georgia,serif;font-size:18px;color:var(--red);margin:0 0 10px;text-decoration:underline wavy var(--red);text-underline-offset:5px;text-decoration-thickness:1px}
.wc{font-size:13px;color:var(--soft);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--blue);color:#fff}
:root[data-theme="dark"] .btn{color:#10141E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10141E}}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--green)} .btn.bad{background:var(--red)}
.hint{font-size:12px;color:var(--soft)}
.fb{margin-top:16px;border-left:4px solid var(--blue);padding:10px 14px;background:var(--blue-bg);border-radius:0 8px 8px 0;font-size:15px}
.fb.ok{border-color:var(--green);background:var(--green-bg)}
.fb.acc{border-color:var(--amber);background:var(--amber-bg)}
.fb.ko{border-color:var(--red);background:var(--red-bg)}
.fb strong{display:block;margin-bottom:2px}
.fb .model{font-family:Literata,Georgia,serif;font-size:16px;line-height:1.55}
.nav{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
.gridnums{display:flex;flex-wrap:wrap;gap:4px;margin-top:22px}
.gridnums button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:5px;font-size:12px;color:var(--soft);padding:0}
.gridnums button.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.gridnums button.acc{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.gridnums button.ko{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.gridnums button.cur{outline:2px solid var(--ink);outline-offset:1px}
.gtitle{font-size:13px;color:var(--soft);margin:22px 0 0}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}
.theme{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:13px}
@media (max-width:560px){.card{padding:18px 14px 18px 34px}.card::before{left:20px}.total{text-align:left}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const LESC = `Explica breument què va ser la Renaixença.##La Renaixença va ser el moviment cultural del segle XIX que va voler recuperar el català com a llengua de cultura i de literatura després de segles de decadència. Lligada al Romanticisme i a la burgesia industrial, idealitzava l'Edat Mitjana. Simbòlicament comença amb «La pàtria» d'Aribau (1833) i es consolida amb els Jocs Florals (1859).
Què eren els Jocs Florals i per què van ser importants?##Eren un certamen literari d'origen medieval restaurat a Barcelona el 1859 amb el lema «Pàtria, Fides, Amor». Premiaven poesia patriòtica (Englantina d'or), religiosa (Viola d'or i d'argent) i amorosa (Flor natural). Van donar prestigi al català escrit, van crear públic i van descobrir autors com Verdaguer o Guimerà, tot i que defensaven un model de llengua arcaïtzant.
Per què Jacint Verdaguer és una figura clau de la Renaixença?##Perquè va demostrar que el català podia tornar a ser una gran llengua literària. Amb «L'Atlàntida» (premiada el 1877) i «Canigó» (1886) va crear grans poemes èpics i va enriquir el lèxic combinant la llengua popular de la Plana de Vic amb la tradició culta. Va ser el poeta més popular del seu temps.
Resumeix l'argument i el simbolisme de «Terra baixa».##Manelic, un pastor ingenu de la muntanya, es casa amb la Marta sense saber que és l'amant de l'amo, Sebastià, que vol tapar la relació. Quan Manelic ho descobreix, mata Sebastià «com un llop» i torna a la muntanya amb la Marta. L'obra oposa la terra alta (puresa, llibertat) a la terra baixa (corrupció, poder i diners).
Explica la polèmica sobre el model de llengua durant la Renaixença.##Els Jocs Florals defensaven un català culte i arcaïtzant, inspirat en els clàssics medievals, mentre que autors com Frederic Soler (Pitarra) defensaven «el català que ara es parla», més popular i viu, sobretot al teatre. La polèmica mostra que encara no hi havia una normativa comuna, que arribarà al segle XX amb Pompeu Fabra.
Quin context social i lingüístic explica l'aparició de la Renaixença?##Al segle XIX el català era la llengua del poble, però el castellà ocupava els usos formals: era una situació de diglòssia. La burgesia catalana, enriquida amb la industrialització, i el Romanticisme europeu, que valorava les llengües i les històries de cada poble, van afavorir la recuperació del català com a llengua de cultura.
Per què és important Narcís Oller per a la literatura catalana?##Oller és el gran novel·lista de la Renaixença i introdueix el realisme i el naturalisme a la narrativa catalana. A «La papallona», prologada per Zola en la traducció francesa, i sobretot a «La febre d'or», retrata la Barcelona burgesa i l'especulació de la borsa. Va demostrar que el català servia per a la novel·la moderna.
Per què «La pàtria» d'Aribau es considera l'inici simbòlic de la Renaixença?##Perquè el 1833, quan gairebé no es publicava literatura culta en català, Aribau va publicar a El Vapor aquest poema en què enyora la terra natal i reivindica la llengua pròpia. Tot i que ell escrivia en castellà, el poema es va convertir en el símbol de la recuperació literària del català.`;

Al sortir de classe, vaig trobar la Laia. @ En sortir de classe, vaig trobar la Laia. @ Valor temporal amb infinitiu: «en + infinitiu».
Fa temps que no el veig, al Joan. @ Fa temps que no el veig, el Joan. @ El CD de persona no porta preposició.
Vaig veure a la Marta al mercat. @ Vaig veure la Marta al mercat. @ El CD no porta la preposició «a».
Tots estaven d'acord en que calia canviar. @ Tots estaven d'acord que calia canviar. @ Caiguda de preposició davant de «que».
Es va quedar a dormir perque era tard. @ Es va quedar a dormir perquè era tard. @ «Perquè» causal porta accent.
Van surtir tard de la festa. @ Van sortir tard de la festa. @ L'infinitiu és «sortir».
He comprat el regal per la meva mare. @ He comprat el regal per a la meva mare. @ Destinatari: «per a».
Ahir em vaig enterar de la notícia. @ Ahir em vaig assabentar de la notícia. @ «Enterar-se» és un castellanisme.
Vam arribar a la estació massa tard. @ Vam arribar a l'estació massa tard. @ L'article s'apostrofa davant de vocal: «l'estació».
Aquest tema és molt important a nivell polític. @ Aquest tema és molt important des del punt de vista polític. / Aquest tema és políticament molt important. @ «A nivell de» és una expressió que cal evitar quan no parla de nivells reals.
Va deixar de fumar fa dos anys enrere. @ Va deixar de fumar fa dos anys. / Va deixar de fumar dos anys enrere. @ Redundància: «fa» i «enrere» volen dir el mateix.

Busquem un pis que tingui ascensor i que sigui barato. @ Busquem un pis que tingui ascensor i que sigui barat. @ «Barato» és castellà: «barat».`;

const PAU = `En què consisteix el canvi i caiguda de preposició? Posa'n exemples.##Les preposicions àtones (a, en, de) que regeix un verb, un nom o un adjectiu cauen obligatòriament davant de la conjunció «que»: «Estic segura de la victòria» → «Estic segura que guanyarem» (no «de que»). Davant d'infinitiu solen mantenir-se, però la preposició «en» sovint es canvia per «a»: «Insisteix en aquest punt» → «Insisteix a repetir-ho».
Explica amb les teves paraules què és la diglòssia.##És una situació en què dues llengües conviuen en una comunitat però amb funcions desiguals: una té prestigi i s'usa en els àmbits formals (administració, escola, mitjans) i l'altra queda reduïda als usos familiars i informals. Ho va descriure Ferguson i ho va ampliar Fishman. Exemple: el català del segle XIX, usat a casa mentre el castellà ocupava els usos formals.
Què és el bilingüisme? Diferencia l'individual del social.##El bilingüisme individual és la capacitat d'una persona de parlar dues llengües. El social és la convivència de dues llengües en una mateixa comunitat. Molts sociolingüistes consideren que un bilingüisme social perfectament equilibrat és difícil de mantenir i que sovint amaga una situació de diglòssia.
Què és la substitució lingüística?##És el procés pel qual una comunitat abandona a poc a poc la seva llengua en favor d'una altra, normalment dominant, fins que deixa de transmetre-la als fills. Sol començar amb una situació de diglòssia.
Què és la normalització lingüística?##És el procés per recuperar els usos socials d'una llengua minoritzada en tots els àmbits (administració, ensenyament, mitjans, comerç) perquè funcioni amb normalitat. Inclou mesures legals, com la Llei de política lingüística de 1998.
Quina diferència hi ha entre normativització i normalització?##La normativització consisteix a fixar les normes d'una llengua (ortografia, gramàtica, diccionari), com van fer Pompeu Fabra i l'IEC a principis del segle XX. La normalització consisteix a estendre'n l'ús social.
Què és un barbarisme? Posa'n exemples.##És una paraula o construcció d'una altra llengua que s'usa sense necessitat quan ja n'hi ha una de pròpia. Exemples: «tenir que» per «haver de», «enterar-se» per «assabentar-se», «disfrutar» per «gaudir».
Què és un doblet lingüístic?##És una parella de paraules que provenen del mateix mot llatí però que han entrat a la llengua per camins diferents: una per evolució popular (patrimonial, més transformada) i l'altra com a cultisme, presa directament del llatí. Exemples: pesar/pensar, cosa/causa, dret/directe.
Explica la diferència entre registre formal i informal.##El registre és la varietat que triem segons la situació (tema, canal, relació entre els parlants i intenció). El formal és propi de situacions acurades, com un examen o una conferència, i usa lèxic precís i estructures elaborades. L'informal és espontani, amb col·loquialismes i frases curtes.
Què és la llengua estàndard?##És la varietat comuna i neutra que fan servir l'escola, els mitjans i l'administració perquè s'entengui a tot el territori. Es basa en la normativa, però és flexible i accepta variants geogràfiques.
Què és un pronom feble i quines funcions pot fer?##És una forma àtona que s'uneix al verb i substitueix un complement: CD (el, la, els, les, ho, en), CI (li, els), atribut (ho), CRV (en, hi) o complement de lloc (hi, en). Va davant del verb (proclític) o darrere, unit amb guionet o apòstrof (enclític).
Què és una perífrasi verbal? Posa'n una d'obligació correcta.##És una construcció de dos verbs (un auxiliar conjugat i un infinitiu, gerundi o participi) que funciona com un sol nucli i expressa matisos d'obligació, aspecte o probabilitat. Obligació: «haver de» + infinitiu («He d'estudiar»), no «tenir que».
Què és la passiva pronominal?##És una construcció amb «es» i un verb en 3a persona que concorda amb el subjecte pacient: «Es venen pisos». Si el subjecte és plural, el verb ha d'anar en plural; és incorrecte «Es ven pisos».
Quan s'usa «per» i quan «per a»?##«Per a» indica destinació o finalitat davant d'un nom («un regal per a la mare»). «Per» indica causa, mitjà, lloc de pas o agent («ho fa per tu», «passa per Girona»). Davant d'infinitiu, la normativa actual admet «per» i «per a» per expressar finalitat.
Quina diferència hi ha entre anàfora i catàfora?##L'anàfora és quan un element remet a una cosa ja dita: «Vaig veure la Laia i la vaig saludar». La catàfora és quan remet a una cosa que es dirà després: «Ja ho he decidit: me'n vaig». Totes dues serveixen per cohesionar el text.
Què és el conflicte lingüístic?##És la situació en què dues llengües d'un mateix territori competeixen pels mateixos àmbits d'ús i una tendeix a imposar-se sobre l'altra. Pot acabar amb la substitució de la llengua dominada o amb la seva normalització.
Què és la derivació? Explica la diferència entre prefix i sufix.##És un procediment per formar paraules noves afegint morfemes a una arrel. El prefix va davant i no canvia la categoria (fer → desfer); el sufix va darrere i sovint sí que la canvia (blanc → blancor). Si s'afegeixen prefix i sufix alhora, és parasíntesi (bony → abonyegat).
Defineix amb les teves paraules «efímer» i fes-ne una frase.##Que dura molt poc temps. Exemple: «L'èxit a les xarxes sovint és efímer».
Defineix amb les teves paraules «palès».##Que és clar i evident, que tothom ho pot veure. Exemple: «Era palès que estava nerviós».
Defineix amb les teves paraules «recança».##Pena o tristesa per haver de deixar o perdre alguna cosa; també una mica de remordiment.
Defineix amb les teves paraules «escaient».##Adequat, que convé a la situació. Exemple: «No és un comentari escaient en un funeral».
Defineix amb les teves paraules «neguit».##Inquietud, nerviosisme o angoixa per alguna cosa que preocupa.
Defineix amb les teves paraules «ingent».##Molt gran, enorme, en quantitat o en mida.
Defineix amb les teves paraules «llòbrec».##Fosc i trist, que fa una mica de por. Exemple: «un soterrani llòbrec».
Defineix amb les teves paraules «avinentesa».##Ocasió o moment oportú per fer alguna cosa.
Defineix amb les teves paraules «pertinaç».##Que persisteix en una idea o una actitud encara que hi hagi dificultats; obstinat.
Defineix amb les teves paraules «copsar».##Captar o entendre el sentit d'alguna cosa, sobretot si no és evident.`;

/* ============ MODEL ============ */
const ABBR={S:"Subjecte",CD:"Complement directe",CI:"Complement indirecte",AT:"Atribut",PVO:"Complement predicatiu",CRV:"Complement de règim verbal",AG:"Complement agent",CC:"Complement circumstancial",CN:"Complement del nom",CADJ:"Complement de l'adjectiu"};
const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
const mc=(s,abbr)=>lines(s).map(l=>{const f=l.split("|");const m=x=>abbr?(ABBR[x]||x):x;return{q:f[0],opts:[m(f[1]),m(f[2]),m(f[3]),m(f[4])],ex:f[5]||""}});
const inp=s=>lines(s).map(l=>{const i=l.lastIndexOf("@");return{q:l.slice(0,i).trim(),ans:l.slice(i+1).split(";").map(a=>a.split("/").map(y=>y.trim()))}});
const SETS=[
 {id:"sin",g:"c",t:"Sinònims",k:"mc",ins:"Tria el sinònim que pot substituir la paraula marcada en aquest context.",items:mc(SIN)},
 {id:"ref",g:"c",t:"Referents",k:"mc",ins:"A què fa referència el pronom o la paraula marcada?",items:mc(REF)},
 {id:"vf",g:"l",t:"Vertader o fals",k:"tf",ins:"Renaixença i Jocs Florals: l’afirmació és vertadera o falsa?",items:lines(VF).map(l=>{const f=l.split("|");return{q:f[0],a:f[1]==="V",ex:f[2]}})},
 {id:"cult",g:"l",t:"Cultura general",k:"mc",ins:"Autors, obres i dades que cal saber.",items:mc(CULT)},
 {id:"lesc",g:"l",t:"Expressió escrita breu",k:"open",ins:"Respon en 50-80 mots i després compara-ho amb la resposta model.",items:lines(LESC).map(l=>{const f=l.split("##");return{q:f[0],m:f[1]}})},
 {id:"func",g:"r",t:"Funcions sintàctiques",k:"mc",ins:"Quina funció sintàctica fa el fragment marcat?",items:mc(FUNC,true)},
 {id:"pron",g:"r",t:"Pronoms febles",k:"mc",ins:"Substitueix per pronoms febles els complements marcats.",items:mc(PRON)},
 {id:"verb",g:"r",t:"Verbs",k:"input",ins:"Escriu la forma verbal que es demana.",items:inp(VERB)},
 {id:"dob",g:"r",t:"Doblets",k:"mc",ins:"Tria la forma correcta: junt o separat, amb accent o sense.",items:lines(DOB).map(l=>{const p=l.split("#"),f=p[0].split("|");return{q:f[0],opts:f.slice(1),ex:p[1]||""}})},
 {id:"der",g:"r",t:"Derivats (dossier)",k:"input",ins:"Escriu la paraula derivada del mot entre parèntesis.",items:inp(DER)},
 {id:"cor",g:"r",t:"Correcció lingüística",k:"fix",ins:"Corregeix l’error editant la frase directament.",items:lines(COR).map(l=>{const f=l.split(" @ ");return{q:f[0],ans:f[1].split(" / "),ex:f[2]}})},
 {id:"pau",g:"p",t:"Minut PAU",k:"open",ins:"Respon amb les teves paraules, com a l’examen, i després compara-ho amb el model.",items:lines(PAU).map(l=>{const f=l.split("##");return{q:f[0],m:f[1]}})}
];
const GROUPS=[{id:"c",n:"1",t:"Comprensió lectora"},{id:"l",n:"2",t:"Fet literari"},{id:"r",n:"3",t:"Reflexió lingüística"},{id:"p",n:"5",t:"Minut PAU"}];
const BYID=Object.fromEntries(SETS.map(s=>[s.id,s]));

/* ============ ESTAT ============ */
const KEY="catala2-trimestre1-v1";
let store={r:{},mode:{},cur:"sin"};
try{const raw=localStorage.getItem(KEY);if(raw)store=Object.assign(store,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
let st={set:BYID[store.cur]?store.cur:"sin",order:[],pos:0,done:false};

const typo=s=>s.replace(/'/g,"’");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const mark=s=>typo(esc(s)).replace(/\[([^\]]+)\]/g,"<mark>$1</mark>");
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/l\.l/g,"l·l").replace(/\s+/g," ").trim().replace(/[.!?;:,]+$/,"");
const loose=s=>norm(s).replace(/[,;:.!?«»"]/g,"").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function seeded(seed){let s=seed;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const res=id=>(store.r[id]||(store.r[id]={}));
const modeOf=id=>(store.mode[id]||(store.mode[id]={rand:false,err:false}));

function buildOrder(){
  const s=BYID[st.set],m=modeOf(s.id),r=res(s.id);
  let idx=s.items.map((_,i)=>i);
  if(m.err)idx=idx.filter(i=>r[i]==="ko"||r[i]==="acc");
  if(m.rand)idx=shuffle(idx,Math.random);
  st.order=idx;st.pos=0;st.done=false;
  if(!m.rand&&!m.err){const first=idx.findIndex(i=>!r[i]);st.pos=first<0?0:first}
}

/* ============ RENDER ============ */
const $=id=>document.getElementById(id);
function renderTotal(){
  let tot=0,done=0;SETS.forEach(s=>{tot+=s.items.length;done+=Object.keys(res(s.id)).length});
  $("total").innerHTML=`<b>${done} / ${tot}</b>exercicis fets`;
}
function renderNav(){
  const g=BYID[st.set].g;
  $("groups").innerHTML=GROUPS.map(x=>`<button class="gbtn" data-g="${x.id}" aria-pressed="${x.id===g}"><span class="n">${x.n}</span>${x.t}</button>`).join("");
  $("sets").innerHTML=SETS.filter(s=>s.g===g).map(s=>`<button class="sbtn" data-s="${s.id}" aria-pressed="${s.id===st.set}">${s.t}<small>${Object.keys(res(s.id)).length}/${s.items.length}</small></button>`).join("");
  document.querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>{const first=SETS.find(s=>s.g===b.dataset.g);goSet(first.id)});
  document.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>goSet(b.dataset.s));
}
function goSet(id){st.set=id;store.cur=id;save();buildOrder();render()}
function counts(){const r=res(st.set);let ok=0,acc=0,ko=0;Object.values(r).forEach(v=>{if(v==="ok")ok++;else if(v==="acc")acc++;else ko++});return{ok,acc,ko}}

function render(){
  renderTotal();renderNav();
  const s=BYID[st.set],m=modeOf(s.id),c=counts(),r=res(s.id);
  const pct=Math.round(Object.keys(r).length/s.items.length*100);
  let html=`<div class="bar"><div class="tools">
    <button class="tbtn" id="tRand" aria-pressed="${m.rand}">Ordre aleatori</button>
    <button class="tbtn" id="tErr" aria-pressed="${m.err}">Només errades</button>
    <button class="tbtn" id="tReset">Esborra el progrés</button>
    <button class="tbtn" id="tTheme">Tema clar / fosc</button></div>
    <div class="stats"><span class="s-ok"><b>${c.ok}</b>bé</span>${s.k==="input"?`<span class="s-acc"><b>${c.acc}</b>accent</span>`:""}<span class="s-ko"><b>${c.ko}</b>${s.k==="open"?"per repassar":"malament"}</span></div></div>
    <div class="progress"><i style="width:${pct}%"></i></div>`;
  if(!st.order.length){
    html+=`<div class="card"><p class="empty">${m.err?"No tens cap errada en aquesta tanda. Desactiva «Només errades» per continuar practicant.":"No hi ha exercicis."}</p></div>`;
  }else if(st.done){
    html+=`<div class="card"><p class="q">Has acabat la tanda de «${s.t}».</p><p>${c.ok} bé${s.k==="input"?`, ${c.acc} amb errades d’accent`:""} i ${c.ko} ${s.k==="open"?"per repassar":"malament"}.</p>
      <div class="actions"><button class="btn" id="again">Torna a començar</button>${c.ko+c.acc?`<button class="btn ghost" id="onlyErr">Repassa les errades</button>`:""}</div></div>`;
  }else html+=`<div class="card" id="card"></div>
    <div class="nav"><button class="btn ghost" id="prev">← Anterior</button><button class="btn ghost" id="skip">Salta →</button></div>`;
  html+=`<p class="gtitle">${st.order.length} exercicis en aquesta tanda</p><div class="gridnums" id="gridn">${st.order.map((i,p)=>`<button data-p="${p}" class="${r[i]||""}${p===st.pos&&!st.done?" cur":""}" aria-label="Exercici ${i+1}">${i+1}</button>`).join("")}</div>`;
  $("main").innerHTML=html;
  $("tRand").onclick=()=>{m.rand=!m.rand;save();buildOrder();render()};
  $("tErr").onclick=()=>{m.err=!m.err;save();buildOrder();render()};
  $("tReset").onclick=()=>{if(confirm(`Vols esborrar el progrés de «${s.t}»?`)){store.r[s.id]={};save();buildOrder();render()}};
  $("tTheme").onclick=toggleTheme;
  document.querySelectorAll("#gridn button").forEach(b=>b.onclick=()=>{st.pos=+b.dataset.p;st.done=false;render()});
  if($("again"))$("again").onclick=()=>{buildOrder();st.pos=0;render()};
  if($("onlyErr"))$("onlyErr").onclick=()=>{m.err=true;save();buildOrder();render()};
  if($("card"))renderCard();
}

let answered=false;
function renderCard(){
  answered=false;
  const s=BYID[st.set],i=st.order[st.pos],it=s.items[i],card=$("card");
  let h=`<div class="meta"><span>${s.t} · ${i+1}</span><span>${st.pos+1} de ${st.order.length}</span></div><p class="instr">${s.ins}</p>`;
  if(s.k==="mc"){
    const opts=shuffle(it.opts.map((t,k)=>({t,c:k===0})),seeded(hash(s.id+i)));
    h+=`<p class="q">${mark(it.q)}</p><div class="opts">${opts.map((o,k)=>`<button class="opt" data-c="${o.c}"><span class="key">${k+1}</span><span>${typo(esc(o.t))}</span></button>`).join("")}</div>`;
  }else if(s.k==="tf"){
    h+=`<p class="q">${mark(it.q)}</p><div class="tf"><button class="opt" data-v="true"><span class="key">1</span>Vertader</button><button class="opt" data-v="false"><span class="key">2</span>Fals</button></div>`;
  }else if(s.k==="input"){
    const parts=typo(esc(it.q)).split("{}");
    h+=`<p class="q">${parts.map((p,k)=>p+(k<parts.length-1?`<input class="blank" data-b="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta ${k+1}">`:"")).join("")}</p>
      <div class="actions"><button class="btn" id="check">Comprova</button><span class="hint">Enter per comprovar i per passar a la següent</span></div>`;
  }else if(s.k==="fix"){
    h+=`<p class="wrongsent">${typo(esc(it.q))}</p><textarea id="fixta" spellcheck="false" aria-label="Frase corregida">${esc(it.q)}</textarea>
      <div class="actions"><button class="btn" id="check">Comprova</button><span class="hint">Enter per comprovar</span></div>`;
  }else if(s.k==="open"){
    h+=`<p class="q">${mark(it.q)}</p><textarea id="opta" placeholder="Escriu la teva resposta aquí…" aria-label="La teva resposta"></textarea><div class="wc" id="wc">0 mots</div>
      <div class="actions"><button class="btn" id="reveal">Mostra la resposta model</button><span class="hint">Ctrl + Enter</span></div>`;
  }
  h+=`<div id="fbox"></div>`;
  card.innerHTML=h;
  $("prev").onclick=()=>{if(st.pos>0){st.pos--;render()}};
  $("skip").onclick=next;
  if(s.k==="mc"||s.k==="tf"){
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickChoice(b));
  }else if(s.k==="input"){
    const ins=card.querySelectorAll("input.blank");ins[0].focus();
    $("check").onclick=checkInput;
  }else if(s.k==="fix"){
    const ta=$("fixta");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
    $("check").onclick=checkFix;
  }else if(s.k==="open"){
    const ta=$("opta");ta.focus();
    ta.oninput=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;$("wc").textContent=`${n} mots`};
    $("reveal").onclick=revealOpen;
  }
}
function record(v){const s=BYID[st.set],i=st.order[st.pos];res(s.id)[i]=v;save();answered=true;renderTotal();renderNav();
  const gb=document.querySelector(`#gridn button[data-p="${st.pos}"]`);if(gb)gb.className=v+" cur";
  const c=counts(),stt=document.querySelector(".stats");if(stt){const sp=stt.querySelectorAll("b");sp[0].textContent=c.ok;if(sp.length===3){sp[1].textContent=c.acc;sp[2].textContent=c.ko}else sp[1].textContent=c.ko}
  const r=res(s.id);document.querySelector(".progress i").style.width=Math.round(Object.keys(r).length/s.items.length*100)+"%";
}
function fb(cls,title,body,extra=""){ $("fbox").innerHTML=`<div class="fb ${cls}"><strong>${title}</strong>${body?`<div class="model">${body}</div>`:""}</div><div class="actions">${extra}<button class="btn" id="nextb">Següent →</button></div>`;
  $("nextb").onclick=next; }
function pickChoice(b){
  if(answered)return;
  const s=BYID[st.set],it=s.items[st.order[st.pos]],btns=[...$("card").querySelectorAll(".opt")];
  let ok;
  if(s.k==="mc"){ok=b.dataset.c==="true";btns.forEach(x=>{x.disabled=true;if(x.dataset.c==="true")x.classList.add("right")})}
  else{ok=(b.dataset.v==="true")===it.a;btns.forEach(x=>{x.disabled=true;if((x.dataset.v==="true")===it.a)x.classList.add("right")})}
  if(!ok)b.classList.add("wrong");
  record(ok?"ok":"ko");
  const ex=it.ex?typo(esc(it.ex)):"";
  fb(ok?"ok":"ko",ok?"Correcte.":(s.k==="tf"?`És ${it.a?"vertader":"fals"}.`:"Incorrecte."),ex);
  $("nextb").focus();
}
function checkInput(){
  if(answered){next();return}
  const s=BYID[st.set],it=s.items[st.order[st.pos]],ins=[...$("card").querySelectorAll("input.blank")];
  let worst="ok";const rank={ok:0,acc:1,ko:2};
  ins.forEach((inp,k)=>{
    const v=norm(inp.value),vs=strip(v),acc=it.ans[k]||[];
    let r="ko";
    if(acc.some(a=>norm(a)===v))r="ok";else if(v&&acc.some(a=>strip(norm(a))===vs))r="acc";
    inp.classList.add(r);inp.readOnly=true;if(rank[r]>rank[worst])worst=r;
  });
  record(worst);
  const sol=it.ans.map(a=>a.join(" / ")).join("  ·  ");
  const title=worst==="ok"?"Correcte.":worst==="acc"?"Gairebé: revisa els accents o la ç.":"Incorrecte.";
  fb(worst,title,`Solució: <b>${typo(esc(sol))}</b>${it.ex?`<br>${typo(esc(it.ex))}`:""}`,worst!=="ok"?`<button class="btn ghost" id="override">Ho tenia bé</button>`:"");
  if($("override"))$("override").onclick=()=>{record("ok");$("override").remove();$("nextb").focus()};
  $("nextb").focus();
}
function checkFix(){
  if(answered){next();return}
  const it=BYID[st.set].items[st.order[st.pos]],ta=$("fixta"),v=loose(ta.value);
  let r="ko";
  if(it.ans.some(a=>loose(a)===v))r="ok";else if(it.ans.some(a=>strip(loose(a))===strip(v)))r="acc";
  ta.readOnly=true;record(r);
  fb(r,r==="ok"?"Correcte.":r==="acc"?"Gairebé: revisa els accents.":"Compara-la amb la solució.",`${it.ans.map(a=>`<b>${typo(esc(a))}</b>`).join("<br>")}<br>${typo(esc(it.ex))}`,r!=="ok"?`<button class="btn ghost" id="override">Ho tenia bé</button>`:"");
  if($("override"))$("override").onclick=()=>{record("ok");$("override").remove();$("nextb").focus()};
  $("nextb").focus();
}
function revealOpen(){
  const it=BYID[st.set].items[st.order[st.pos]];
  $("reveal").disabled=true;
  $("fbox").innerHTML=`<div class="fb"><strong>Resposta model</strong><div class="model">${typo(esc(it.m))}</div></div>
    <div class="actions"><span class="hint">Com t’ha sortit?</span><button class="btn good" id="selfok">M’ha sortit bé</button><button class="btn bad" id="selfko">Per repassar</button><button class="btn ghost" id="nextb">Salta →</button></div>`;
  $("selfok").onclick=()=>{record("ok");next()};
  $("selfko").onclick=()=>{record("ko");next()};
  $("nextb").onclick=next;
}
function next(){if(st.pos<st.order.length-1){st.pos++;render()}else{st.done=true;render()}}

document.addEventListener("keydown",e=>{
  const s=BYID[st.set];if(!$("card"))return;
  const tag=(document.activeElement||{}).tagName;
  if(s.k==="open"){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!$("reveal").disabled)revealOpen()}return}
  if(e.key==="Enter"){
    if(tag==="BUTTON"&&!answered)return;
    e.preventDefault();
    if(answered){next();return}
    if(s.k==="input")checkInput();else if(s.k==="fix")checkFix();
    return;
  }
  if((s.k==="mc"||s.k==="tf")&&!answered&&/^[1-4]$/.test(e.key)&&tag!=="INPUT"&&tag!=="TEXTAREA"){
    const b=$("card").querySelectorAll(".opt")[+e.key-1];if(b)pickChoice(b);
  }
});

function toggleTheme(){
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",root.dataset.theme)}catch(e){}
}
try{const t=localStorage.getItem(KEY+"-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}

buildOrder();render();
</script>
</body>
